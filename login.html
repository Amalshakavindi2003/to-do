<!DOCTYPE html>
<html lang="en" data-page="auth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List - Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page" data-auth-mode="login">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>To-Do List</h1>
        <p class="auth-subtitle">Sign in to continue to your tasks</p>
      </div>

      <div id="status" class="status" aria-live="polite"></div>

      <form id="authForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="emailInput">Email Address</label>
          <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" placeholder="Your password" autocomplete="current-password" required>
        </div>

        <button type="submit" id="authSubmitBtn" class="btn-primary btn-large">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>
          New here?
          <a class="btn-link" href="signup.html">Create an account</a>
        </p>
      </div>

      <div class="dark-mode-toggle">
        <button type="button" id="darkModeBtn" class="dark-mode-btn">🌙 Dark Mode</button>
      </div>
    </div>
  </div>

  <script src="auth.js?v=20260507-auth-pages"></script>
</body>
</html>
