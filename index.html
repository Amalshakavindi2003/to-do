<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>To-Do List</h1>
      <button type="button" class="dark-mode-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <div class="input-section">
      <input id="taskInput" type="text" placeholder="Enter task description">
      <button type="button" class="add-btn" onclick="addTask()">Add Task</button>
    </div>

    <div class="stats">
      <p>Tasks: <span id="taskCount">0</span> | Completed: <span id="completedCount">0</span></p>
    </div>

    <div class="action-buttons">
      <button type="button" class="clear-btn" onclick="clearAll()">Clear All</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="app.js?v=20260505"></script>
</body>
</html>
